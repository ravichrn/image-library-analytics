# Manual threshold overrides for the coach rule engine.
# These values win over auto-calibrated thresholds derived from your library.
# Remove or comment out any entry to let calibration determine it automatically.
#
# Fixed technical thresholds (always hardcoded, not auto-tuned):
#   horizon_tilt_deg: 1.5     — physical standard; tilt above this in degrees triggers flag
#   highlight_clipping: 0.03  — >3% blown pixels triggers flag
#   shadow_clipping: 0.05     — >5% crushed blacks triggers flag
#
# Uncomment and edit to override a calibrated threshold:
# aesthetic_floor: 35
# aesthetic_high: 65
# iq_floor: 40
# thirds_score_min: 0.72
# foreground_clutter: 0.22
# negative_space_min: 0.25
# subject_isolation_min: 0.85
# saliency_off_center: 0.25
