# Coach rule thresholds — edit and re-run to adjust sensitivity.
# Reload takes effect on the next run; no code changes needed.

thirds_score_min: 0.72      # subject_centered: thirds_score below this triggers the flag
horizon_tilt_deg: 1.5       # horizon_tilted: tilt in degrees above this triggers the flag
foreground_clutter: 0.22    # foreground_cluttered: edge density above this triggers the flag
negative_space_min: 0.25    # frame_too_busy: negative_space below this triggers the flag
subject_isolation_min: 0.85 # low_subject_isolation: isolation ratio below this triggers the flag
aesthetic_floor: 35         # low_aesthetic: score below this triggers the flag
aesthetic_high: 65          # iq_low_aesthetic_high: aesthetic above this (combined with iq_floor)
iq_floor: 40                # iq_low_aesthetic_high: iq_score below this triggers the flag
highlight_clipping: 0.03    # highlight_clipping: fraction of blown pixels above this triggers the flag
shadow_clipping: 0.05       # shadow_clipping: fraction of crushed blacks above this triggers the flag
saliency_off_center: 0.25   # saliency_off_center_conflict: subject_off_center above this triggers the flag
